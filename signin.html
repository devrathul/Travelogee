<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
    <main>
        <section>
            <div class="bgSignUp w-full m-auto flex flex-col items-center justify-center h-screen">
                <div class="max-w-[450px] w-full m-auto bg-white/90 rounded-xl px-5 py-10">
                    <form action="" id="formSignIn">
                        <div class="p-5">                            
                            <div class="flex flex-col gap-2">
                                <label for="txtEmail">Email</label>
                                <input type="text" name="txtEmail" id="txtEmail"
                                    class="border-[1px] border-gray-300 outline-gray-200 rounded-md p-2">
                                <span class="errorMsg" id="errorEmail"></span>
                            </div>                            
                            <div class="flex flex-col gap-2">
                                <label for="txtPassword">Password</label>
                                <input type="text" name="txtPassword" id="txtPassword"
                                    class="border-[1px] border-gray-300 outline-gray-200 rounded-md p-2">
                                <span class="errorMsg" id="errorPassword"></span>
                            </div>
                            <div class="flex justify-center mt-5 gap-2">
                                <button class="p-3 w-1/2 bg-blue-500 hover:bg-blue-600 text-white rounded-full cursor-pointer"
                                    type="button">Sign In</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
